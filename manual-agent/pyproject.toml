[project]
name = "manual-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NureKhodanytskaYelyzaveta", email = "yelyzaveta.khodanytska@nure.ua" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
manual-agent = "manual_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]