[project]
name = "manual-agent"
version = "0.1.0"
description = "Minimal observe-reason-act agent, Unity MonoBehaviour lifecycle"
readme = "README.md"
authors = [
    { name = "NureKhodanytskaYelyzaveta", email = "yelyzaveta.khodanytska@nure.ua" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.0.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
